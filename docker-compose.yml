services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: neuri
      POSTGRES_PASSWORD: neuri
      POSTGRES_DB: neuri
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuri -d neuri"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:5433:5432" # 이 컴퓨터 안에서만 접속 (서버에서 바깥에 열지 않음)
    volumes:
      - neuri-db:/var/lib/postgresql/data
  # 배포 이미지 확인용:  docker compose --profile app up --build  →  http://localhost:3200
  app:
    profiles: [app]
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      DATABASE_URL: postgres://neuri:neuri@db:5432/neuri
    ports:
      - "${APP_PORT:-3200}:3000" # 서버에서는 .env에 APP_PORT=80
    depends_on:
      db:
        condition: service_healthy
volumes:
  neuri-db:
